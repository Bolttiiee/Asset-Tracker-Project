<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B6CB0" />
      <stop offset="100%" stop-color="#319795" />
    </linearGradient>

    <linearGradient id="leftNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F82C8" />
      <stop offset="100%" stop-color="#2B6CB0" />
    </linearGradient>

    <linearGradient id="rightNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45B0AC" />
      <stop offset="100%" stop-color="#319795" />
    </linearGradient>

    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D7F1FF" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D6FFF7" />
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#133A64" flood-opacity="0.18" />
    </filter>

    <filter id="textShadow" x="-10%" y="-40%" width="120%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#0F2745" flood-opacity="0.2" />
    </filter>
  </defs>

  <g transform="translate(10, 10)" filter="url(#softShadow)">
    <polygon
      points="50,5 90,28 90,72 50,95 10,72 10,28"
      fill="none"
      stroke="url(#brandGradient)"
      stroke-width="6"
      stroke-linejoin="round"
    />

    <circle cx="35" cy="50" r="13" fill="url(#leftNode)" />
    <circle cx="65" cy="50" r="13" fill="url(#rightNode)" />

    <path d="M 35 50 L 65 50" stroke="url(#beam)" stroke-width="4.2" stroke-linecap="round" stroke-dasharray="2.4,2.4" />
    <path d="M 42 44 Q 50 32 58 44" fill="none" stroke="#F4FCFF" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 42 56 Q 50 68 58 56" fill="none" stroke="#F4FCFF" stroke-width="2.2" stroke-linecap="round" />

    <circle cx="50" cy="50" r="2.8" fill="#FFFFFF" opacity="0.9" />
  </g>

  <text
    x="125"
    y="68"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="38"
    font-weight="800"
    fill="#2D3748"
    letter-spacing="0.4"
    filter="url(#textShadow)"
  >
    Asset<tspan fill="url(#brandGradient)">Tracker</tspan>
  </text>
</svg>
