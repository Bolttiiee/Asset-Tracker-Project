<div *ngIf="isLoggedIn() && !isAuthRoute(); else authLayout" class="grid grid-cols-[260px_1fr] h-screen overflow-hidden bg-slate-50 font-sans text-slate-800">
	<aside class="bg-white text-slate-600 p-6 flex flex-col gap-8 border-r border-slate-200 shadow-sm h-screen sticky top-0 overflow-y-auto custom-scrollbar" aria-label="Primary">
		<div class="flex items-center justify-start pb-4 border-b border-slate-100">
			<img class="h-8 object-contain" src="/asset-tracker-logo.svg" alt="Asset Tracker" />
		</div>

		<nav class="flex flex-col gap-2 flex-1">
			<a routerLink="/my-assets" routerLinkActive="active" class="group flex items-center justify-between gap-3 text-slate-600 font-medium text-sm px-4 py-3 rounded-xl border border-transparent hover:bg-slate-50 hover:text-indigo-700 hover:translate-x-1 transition-all duration-300">
				<span>My Assets</span>
			</a>
			<a routerLink="/inventory" routerLinkActive="active" class="group flex items-center justify-between gap-3 text-slate-600 font-medium text-sm px-4 py-3 rounded-xl border border-transparent hover:bg-slate-50 hover:text-indigo-700 hover:translate-x-1 transition-all duration-300">
				<span>Inventory</span>
			</a>
			<a *ngIf="isAdminOrManager()" routerLink="/reports" routerLinkActive="active" class="group flex items-center justify-between gap-3 text-slate-600 font-medium text-sm px-4 py-3 rounded-xl border border-transparent hover:bg-slate-50 hover:text-indigo-700 hover:translate-x-1 transition-all duration-300">
				<span>Reports</span>
			</a>
			<a *ngIf="isAdmin()" routerLink="/user-administration" routerLinkActive="active" class="group flex items-center justify-between gap-3 text-slate-600 font-medium text-sm px-4 py-3 rounded-xl border border-transparent hover:bg-slate-50 hover:text-indigo-700 hover:translate-x-1 transition-all duration-300">
				<span>User Admin</span>
				<span *ngIf="pendingApprovalsCount > 0" class="min-w-6 h-6 px-1.5 inline-grid place-items-center rounded-full text-[11px] font-bold text-amber-700 bg-amber-100">{{ pendingApprovalsCount }}</span>
			</a>
			<a *ngIf="isAdmin()" routerLink="/audit-log" routerLinkActive="active" class="group flex items-center justify-between gap-3 text-slate-600 font-medium text-sm px-4 py-3 rounded-xl border border-transparent hover:bg-slate-50 hover:text-indigo-700 hover:translate-x-1 transition-all duration-300">
				<span>Audit</span>
			</a>
		</nav>

		<div class="mt-auto flex flex-col gap-4 pt-6 border-t border-slate-100 relative">
			<div class="inline-flex items-center justify-between w-full py-1.5 pl-4 pr-1.5 rounded-xl text-xs font-semibold bg-indigo-50 text-indigo-700 border border-indigo-100/50">
				<span>{{ getUserRole() }}</span>
				<button (click)="toggleUserInfo($event)" class="p-1 rounded-lg hover:bg-indigo-200/50 transition-colors cursor-pointer flex items-center justify-center" title="View Profile Info">
					<img src="/user-avatar.png" alt="Profile" class="w-6 h-6 object-contain rounded-lg" />
				</button>
			</div>

			<!-- User Info Popover -->
			<div *ngIf="showUserInfo && getUserProfile()" (click)="$event.stopPropagation()" class="absolute bottom-28 left-0 right-0 bg-white border border-slate-200 rounded-2xl shadow-xl p-4 flex flex-col gap-3 z-50 transition-all duration-300">
				<div class="flex justify-between items-center pb-2 border-b border-slate-100">
					<span class="text-xs font-bold text-slate-400 uppercase tracking-wider">User Profile</span>
					<button (click)="showUserInfo = false" class="text-slate-400 hover:text-slate-600 transition-colors text-xs font-medium cursor-pointer">Close</button>
				</div>
				<div class="flex flex-col gap-1">
					<div class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Name</div>
					<div class="text-xs font-semibold text-slate-800">{{ getUserProfile()?.fullName }}</div>
				</div>
				<div class="flex flex-col gap-1">
					<div class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Email (Username)</div>
					<div class="text-xs font-semibold text-slate-800 break-all">{{ getUserProfile()?.email }}</div>
				</div>
			</div>

			<a routerLink="/login" (click)="logout()" class="text-sm font-semibold text-slate-600 border border-slate-200 bg-white hover:bg-rose-50 hover:text-rose-600 hover:border-rose-200 py-2.5 rounded-xl text-center shadow-sm transition-all duration-300 cursor-pointer">Sign out</a>
		</div>
	</aside>

	<main class="p-8 overflow-y-auto custom-scrollbar relative">
		<router-outlet></router-outlet>
	</main>
</div>

<ng-template #authLayout>
	<router-outlet></router-outlet>
</ng-template>
