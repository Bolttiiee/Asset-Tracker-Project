<app-drawer [isOpen]="isOpen" [title]="drawerTitle" (closeDrawer)="closeModal()">
  <form [formGroup]="assetForm" (ngSubmit)="submitAsset()" style="display: flex; flex-direction: column; gap: 1rem;">
    <div>
      <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #4a5568; margin-bottom: 4px;">Asset Name *</label>
      <input type="text" formControlName="name" placeholder="e.g. Dell Latitude 5420" style="width: 100%; padding: 0.6rem; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box;" [style.border-color]="assetForm.get('name')?.touched && assetForm.get('name')?.invalid ? '#e53e3e' : '#cbd5e0'" />
      <small *ngIf="assetForm.get('name')?.touched && assetForm.get('name')?.errors?.['required']" style="color: #e53e3e; font-size: 0.75rem; margin-top: 2px; display: block;">Asset name is required.</small>
      <small *ngIf="assetForm.get('name')?.touched && assetForm.get('name')?.errors?.['minlength']" style="color: #e53e3e; font-size: 0.75rem; margin-top: 2px; display: block;">Name must be at least 3 characters long.</small>
    </div>

    <div>
      <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #4a5568; margin-bottom: 4px;">Category *</label>
      <input type="text" formControlName="category" placeholder="e.g. Laptop, Monitor, Peripheral" style="width: 100%; padding: 0.6rem; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box;" [style.border-color]="assetForm.get('category')?.touched && assetForm.get('category')?.invalid ? '#e53e3e' : '#cbd5e0'" />
      <small *ngIf="assetForm.get('category')?.touched && assetForm.get('category')?.errors?.['required']" style="color: #e53e3e; font-size: 0.75rem; margin-top: 2px; display: block;">Category is required.</small>
    </div>

    <div>
      <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #4a5568; margin-bottom: 4px;">Serial Number *</label>
      <input type="text" formControlName="serialNumber" placeholder="e.g. LAPTOP123456" style="width: 100%; padding: 0.6rem; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box;" [style.border-color]="assetForm.get('serialNumber')?.touched && assetForm.get('serialNumber')?.invalid ? '#e53e3e' : '#cbd5e0'" />
      <small *ngIf="assetForm.get('serialNumber')?.touched && assetForm.get('serialNumber')?.errors?.['required']" style="color: #e53e3e; font-size: 0.75rem; margin-top: 2px; display: block;">Serial number is required.</small>
      <small *ngIf="assetForm.get('serialNumber')?.touched && assetForm.get('serialNumber')?.errors?.['pattern']" style="color: #e53e3e; font-size: 0.75rem; margin-top: 2px; display: block;">Use 8-20 uppercase letters or numbers only.</small>
      <small *ngIf="serialValidationError" style="color: #9b2c2c; font-size: 0.75rem; margin-top: 2px; display: block;">{{ serialValidationError }}</small>
    </div>

    <div>
      <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #4a5568; margin-bottom: 4px;">Condition *</label>
      <select formControlName="condition" style="width: 100%; padding: 0.6rem; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box;" [style.border-color]="assetForm.get('condition')?.touched && assetForm.get('condition')?.invalid ? '#e53e3e' : '#cbd5e0'">
        <option value="New">New</option>
        <option value="Good">Good</option>
        <option value="Fair">Fair</option>
        <option value="Poor">Poor</option>
      </select>
      <small *ngIf="assetForm.get('condition')?.touched && assetForm.get('condition')?.errors?.['required']" style="color: #e53e3e; font-size: 0.75rem; margin-top: 2px; display: block;">Condition is required.</small>
    </div>

    <div>
      <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #4a5568; margin-bottom: 4px;">Procurement Asset Value (Rand) *</label>
      <input type="number" formControlName="value" step="0.01" style="width: 100%; padding: 0.6rem; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box;" [style.border-color]="assetForm.get('value')?.touched && assetForm.get('value')?.invalid ? '#e53e3e' : '#cbd5e0'" />
      <small *ngIf="assetForm.get('value')?.touched && assetForm.get('value')?.errors?.['required']" style="color: #e53e3e; font-size: 0.75rem; margin-top: 2px; display: block;">Value is required.</small>
      <small *ngIf="assetForm.get('value')?.touched && assetForm.get('value')?.errors?.['min']" style="color: #e53e3e; font-size: 0.75rem; margin-top: 2px; display: block;">Value must be greater than R0.00.</small>
    </div>

    <div>
      <label style="display: block; font-size: 0.85rem; font-weight: 700; color: #4a5568; margin-bottom: 4px;">Notes / Description (Optional)</label>
      <textarea formControlName="notes" rows="3" placeholder="Additional details about this asset..." style="width: 100%; padding: 0.6rem; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box; resize: vertical; font-family: inherit; font-size: 0.9rem;"></textarea>
      <small *ngIf="assetForm.get('notes')?.errors?.['maxlength']" style="color: #e53e3e; font-size: 0.75rem; margin-top: 2px; display: block;">Notes cannot exceed 500 characters.</small>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 0.5rem; border-top: 1px solid #edf2f7; padding-top: 1rem;">
      <button type="button" [disabled]="isSubmitting" (click)="closeModal()" style="background: #edf2f7; color: #4a5568; border: none; padding: 0.6rem 1.2rem; border-radius: 4px; cursor: pointer; font-size: 0.9rem;">Cancel</button>
      <button type="submit" [disabled]="assetForm.invalid || isSubmitting" [style.background]="assetForm.invalid || isSubmitting ? '#cbd5e0' : '#2b6cb0'" [style.cursor]="assetForm.invalid || isSubmitting ? 'not-allowed' : 'pointer'" style="color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 4px; font-size: 0.9rem; font-weight: 700; transition: all 0.2s;">
        {{ isSubmitting ? (mode === 'edit' ? 'Saving...' : 'Provisioning...') : (mode === 'edit' ? 'Save Changes' : 'Provision Asset') }}
      </button>
    </div>
  </form>
</app-drawer>
