<div *ngIf="isLoggedIn() && !isAuthRoute(); else authLayout" class="app-shell">
	<aside class="side-nav" aria-label="Primary">
		<div class="brand-block">
			<img class="brand-logo" src="/asset-tracker-logo.svg" alt="Asset Tracker" />
		</div>

		<nav class="nav-group">
			<a routerLink="/inventory" routerLinkActive="active" class="side-link">Inventory</a>
			<a routerLink="/my-assets" routerLinkActive="active" class="side-link">My Assets</a>
			<a *ngIf="isAdminOrManager()" routerLink="/reports" routerLinkActive="active" class="side-link">Reports</a>
			<a *ngIf="isAdmin()" routerLink="/user-administration" routerLinkActive="active" class="side-link">
				User Admin
				<span *ngIf="pendingApprovalsCount > 0" class="pending-pill">{{ pendingApprovalsCount }}</span>
			</a>
			<a *ngIf="isAdmin()" routerLink="/audit-log" routerLinkActive="active" class="side-link">Audit</a>
		</nav>

		<div class="side-footer">
			<div class="role-chip">{{ getUserRole() }}</div>
			<a routerLink="/login" (click)="logout()" class="logout-link">Sign out</a>
		</div>
	</aside>

	<main class="app-main">
		<router-outlet></router-outlet>
	</main>
</div>

<ng-template #authLayout>
	<router-outlet></router-outlet>
</ng-template>
